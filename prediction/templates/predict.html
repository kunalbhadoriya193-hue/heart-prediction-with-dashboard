{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="{% static 'css/predict.css' %}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>❤️ Heart Disease Prediction</h1>

        <div class="form">

            <input type="number" id="age" placeholder="Age">

            <select id="sex">
                <option value="">Select Gender</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>

            <select id="chestPain">
                <option value="">Chest Pain Type</option>
                <option value="ATA">ATA</option>
                <option value="NAP">NAP</option>
                <option value="ASY">ASY</option>
                <option value="TA">TA</option>
            </select>

            <input
                type="number"
                id="restingBP"
                placeholder="Resting Blood Pressure">

            <input
                type="number"
                id="cholesterol"
                placeholder="Cholesterol">

            <select id="fastingBS">
                <option value="">Fasting Blood Sugar</option>
                <option value="0">0</option>
                <option value="1">1</option>
            </select>

            <select id="restingECG">
                <option value="">Resting ECG</option>
                <option value="Normal">Normal</option>
                <option value="ST">ST</option>
                <option value="LVH">LVH</option>
            </select>

            <input
                type="number"
                id="maxHR"
                placeholder="Maximum Heart Rate">

            <input
                type="number"
                step="0.1"
                id="oldPeak"
                placeholder="Old Peak">

            <select id="exerciseAngina">
                <option value="">Exercise Angina</option>
                <option value="Y">Yes</option>
                <option value="N">No</option>
            </select>

            <select id="stSlope">
                <option value="">ST Slope</option>
                <option value="Up">Up</option>
                <option value="Flat">Flat</option>
                <option value="Down">Down</option>
            </select>

            <button onclick="predict()">
                Predict
            </button>

            <button onclick="window.location.href='/prediction/dashboard-page/'">
                Dashboard
            </button>

            <h2 id="result"></h2>

            <p id="chance"></p>

        </div>

    </div>

</div>

<script src="{% static 'js/predict.js' %}"></script>

</body>
</html>
